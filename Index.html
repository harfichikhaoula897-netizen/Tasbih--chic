<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasbih Chic - تطبيق التسبيح</title>
    <style>
        :root {
            --primary-pink: #fce4ec;
            --deep-pink: #d81b60;
            --accent-gold: #d4af37;
            --gold-light: #fff8e1;
            --text-color: #4a4a4a;
        }
        body {
            background: linear-gradient(135deg, #fce4ec, #f8bbd0);
            color: var(--text-color);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            background: #ffffff;
            border-radius: 25px;
            box-shadow: 0 10px 30px rgba(216, 27, 96, 0.2);
            width: 90%;
            max-width: 400px;
            padding: 20px;
            text-align: center;
            border: 2px solid var(--accent-gold);
        }
        h1 {
            color: var(--deep-pink);
            font-size: 24px;
            margin-bottom: 5px;
            text-shadow: 1px 1px 2px rgba(212, 175, 55, 0.3);
        }
        .dhikr-text {
            background: var(--gold-light);
            border: 1px solid var(--accent-gold);
            border-radius: 15px;
            padding: 10px;
            margin: 15px 0;
            font-size: 18px;
            font-weight: bold;
            color: #5d4037;
        }
        .counter-circle {
            width: 180px;
            height: 180px;
            background: linear-gradient(145deg, #ffffff, var(--primary-pink));
            border: 5px solid var(--accent-gold);
            border-radius: 50%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            margin: 20px auto;
            cursor: pointer;
            box-shadow: inset 0 5px 10px rgba(0,0,0,0.05), 0 5px 15px rgba(212, 175, 55, 0.4);
            transition: transform 0.1s;
            user-select: none;
        }
        .counter-circle:active {
            transform: scale(0.95);
        }
        .count-number {
            font-size: 50px;
            font-weight: bold;
            color: var(--deep-pink);
        }
        .count-label {
            font-size: 14px;
            color: var(--accent-gold);
            font-weight: bold;
        }
        .targets {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin: 15px 0;
            flex-wrap: wrap;
        }
        .target-btn {
            background: #fff;
            border: 1px solid var(--accent-gold);
            color: var(--deep-pink);
            padding: 6px 12px;
            border-radius: 20px;
            cursor: pointer;
            font-weight: bold;
            font-size: 13px;
            transition: 0.2s;
        }
        .target-btn.active, .target-btn:hover {
            background: var(--accent-gold);
            color: #fff;
        }
        .actions {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 15px;
        }
        .btn {
            background: var(--deep-pink);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 12px;
            cursor: pointer;
            font-weight: bold;
            font-size: 14px;
            box-shadow: 0 4px 10px rgba(216, 27, 96, 0.3);
        }
        .btn-secondary {
            background: #b0bec5;
        }
        .stats {
            margin-top: 20px;
            font-size: 13px;
            color: #78909c;
            border-top: 1px dashed var(--accent-gold);
            padding-top: 10px;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Tasbih Chic 🌸</h1>
    
    <div class="dhikr-text" id="dhikrDisplay" onclick="changeDhikr()">
        سبحان الله
    </div>

    <div class="counter-circle" onclick="incrementCount()">
        <span class="count-number" id="count">0</span>
        <span class="count-label" id="targetLabel">الهدف: 33</span>
    </div>

    <div class="targets">
        <button class="target-btn active" onclick="setTarget(33, this)">33</button>
        <button class="target-btn" onclick="setTarget(99, this)">99</button>
        <button class="target-btn" onclick="setTarget(100, this)">100</button>
        <button class="target-btn" onclick="setTarget(1000, this)">1000</button>
    </div>

    <div class="actions">
        <button class="btn btn-secondary" onclick="undoCount()">تراجع ↩</button>
        <button class="btn btn-secondary" onclick="resetCount()">تصفير 🔄</button>
    </div>

    <div class="stats" id="statsDisplay">
        المجموع اليومي: 0 | مجموع التسبيحات: 0
    </div>
</div>

<script>
    let count = parseInt(localStorage.getItem('tasbih_count')) || 0;
    let totalCount = parseInt(localStorage.getItem('tasbih_total')) || 0;
    let target = parseInt(localStorage.getItem('tasbih_target')) || 33;
    
    const dhikrs = ["سبحان الله", "الحمد لله", "لا إله إلا الله", "الله أكبر", "استغفر الله العظيم"];
    let currentDhikrIndex = parseInt(localStorage.getItem('tasbih_dhikr_idx')) || 0;

    const countEl = document.getElementById('count');
    const targetLabelEl = document.getElementById('targetLabel');
    const dhikrDisplayEl = document.getElementById('dhikrDisplay');
    const statsDisplayEl = document.getElementById('statsDisplay');

    function updateView() {
        countEl.innerText = count;
        targetLabelEl.innerText = `الهدف: ${target}`;
        dhikrDisplayEl.innerText = dhikrs[currentDhikrIndex];
        statsDisplayEl.innerText = `المجموع اليومي: ${totalCount} | الهدف الحالي: ${target}`;
        
        localStorage.setItem('tasbih_count', count);
        localStorage.setItem('tasbih_total', totalCount);
        localStorage.setItem('tasbih_target', target);
        localStorage.setItem('tasbih_dhikr_idx', currentDhikrIndex);
    }

    function incrementCount() {
        count++;
        totalCount++;
        if (count >= target) {
            if (navigator.vibrate) navigator.vibrate(200); // اهتزاز عند بلوغ الهدف
        }
        updateView();
    }

    function undoCount() {
        if (count > 0) {
            count--;
            totalCount = Math.max(0, totalCount - 1);
            updateView();
        }
    }

    function resetCount() {
        count = 0;
        updateView();
    }

    function setTarget(t, btn) {
        target = t;
        count = 0;
        document.querySelectorAll('.target-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        updateView();
    }

    function changeDhikr() {
        currentDhikrIndex = (currentDhikrIndex + 1) % dhikrs.length;
        updateView();
    }

    updateView();
</script>

</body>
</html>
